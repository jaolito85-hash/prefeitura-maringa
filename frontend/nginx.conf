server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Segurança — cabeçalhos que protegem o painel
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Proxy — repassa chamadas /api/* para o backend FastAPI
    # Assim o frontend e o backend compartilham o mesmo domínio
    location /api/ {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Proxy — repassa webhooks do WhatsApp para o backend
    # client_max_body_size 25MB: vídeo 16MB em base64 fica ~22MB
    location /webhook/ {
        client_max_body_size 25m;
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Health check do backend acessível externamente
    location /health {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # Câmeras do SOS Mulher -> MediaMTX.
    # O nome "mediamtx" é resolvido sob demanda (resolver do Docker + variável):
    # se o serviço não existir, só estas rotas dão 502 e o painel segue de pé.
    # "^~" impede que a regra de cache de estáticos (regex abaixo) capture os .mp4.
    location ^~ /cam/hls/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $mtx_hls http://mediamtx:8888;
        rewrite ^/cam/hls/(.*)$ /$1 break;
        proxy_pass $mtx_hls;
        proxy_redirect / /cam/hls/;
        absolute_redirect off;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 30s;
        add_header Cache-Control "no-store" always;
    }

    # Sinalização WebRTC (WHEP). A mídia em si vai direto na porta 8189 do MediaMTX.
    location ^~ /cam/webrtc/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $mtx_webrtc http://mediamtx:8889;
        rewrite ^/cam/webrtc/(.*)$ /$1 break;
        proxy_pass $mtx_webrtc;
        proxy_redirect / /cam/webrtc/;
        absolute_redirect off;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
        add_header Cache-Control "no-store" always;
    }

    # SPA — envia todas as rotas para o index.html (necessário para o React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache de longa duração para arquivos estáticos (JS, CSS, imagens)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
